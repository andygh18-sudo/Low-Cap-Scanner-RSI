name: Crypto Low-Cap Scanner v8.1

on:
  workflow_dispatch:
  schedule:
    - cron: "7 7 * * *"
      timezone: "Europe/London"

permissions:
  contents: write

concurrency:
  group: crypto-lowcap-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run v8.1 background engine
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_actions_engine_v8_1.py

      - name: Verify v8.1 output
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/latest_scan.json",encoding="utf-8"))
          assert p["meta"]["engine_version"]=="v8.1"
          assert p["meta"]["pre_screen_count"]>=50
          assert p["top10"]
          print("ENGINE:",p["meta"]["engine_version"])
          print("PRE-SCREEN:",p["meta"]["pre_screen_count"])
          print("REGIME:",p["meta"]["regime"])
          print("TOP:",[(x["ticker"],x["breakout_state"],x["weighted_rsi"]) for x in p["top10"]])
          PY

      - name: Commit latest scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_scan.json data/telegram_alert_state.json
          git diff --cached --quiet || git commit -m "Update v8.1 crypto scan results"
          git push
