name: Crypto Low-Cap Scanner v8.2.5

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# Keep the scan chain strictly sequential.
# The current run finishes first; the self-dispatched next run waits in the queue.
concurrency:
  group: crypto-lowcap-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install scanner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run v8.2.5 background engine
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_actions_engine_v8_1.py
      - name: Verify v8.2.5 output
        run: |
          python - <<'PY'
          import json
          p=json.load(open("data/latest_scan.json",encoding="utf-8"))
          assert p["meta"]["engine_version"]=="v8.2.5"
          assert p["meta"]["pre_screen_count"]>=50
          assert p["top10"]
          assert "btc_market" in p
          assert p["btc_market"]["signal"]
          assert "btc_dominance_pct" in p["meta"]
          assert "btc_dominance_trend" in p["meta"]
          assert "total3_btc_ratio" in p["meta"]
          assert "total3_btc_trend" in p["meta"]
          assert p["btc_market"].get("total3_btc_trend")
          assert "fear_greed_value" in p["meta"]
          assert "fear_greed_classification" in p["meta"]
          assert "fear_greed_value" in p["btc_market"]
          print("ENGINE:",p["meta"]["engine_version"])
          print("PRE-SCREEN:",p["meta"]["pre_screen_count"])
          print("BTC:",p["btc_market"]["signal"])
          print("BTC DOMINANCE:",p["meta"]["btc_dominance_pct"],p["meta"]["btc_dominance_trend"])
          print("REGIME:",p["meta"]["regime"])
          print("TOP:",[(x["ticker"],x["breakout_state"],x["weighted_rsi"]) for x in p["top10"]])
          PY
      - name: Commit latest scan results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_scan.json data/telegram_alert_state.json data/market_context_history.json
          if git diff --cached --quiet; then
            echo "No result changes to commit."
          else
            git commit -m "Update v8.2.5 crypto scan results and market context history"
            
            # Another chained scan may have advanced main while this scan was running.
            # Rebase the result commit onto the latest remote main, then retry the push.
            for attempt in 1 2 3; do
              if git fetch origin main && git rebase origin/main && git push origin HEAD:main; then
                echo "Result push succeeded on attempt $attempt."
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Result push failed after 3 attempts."
                exit 1
              fi
              echo "Remote main moved; retrying after refresh..."
              sleep 5
            done
          fi

      - name: Start next scan after successful run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run crypto_scanner_v8_1.yml --ref main
